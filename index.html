<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#4f46e5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>采购清单</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body data-page="list">
  <header class="site-header">
    <div class="container header-inner">
      <div class="header-left">
        <h1>📦 采购清单</h1>
        <p class="subtitle">记录每一件采购的商品，轻松管理购物清单</p>
      </div>
      <div class="header-right">
        <button id="auth-login-btn" class="btn-login" type="button">登录</button>
        <div id="user-info" class="user-info hidden">
          <span class="user-name"></span>
          <span class="user-role"></span>
          <button id="logout-btn" class="btn-logout" type="button">退出</button>
        </div>
        <a href="add.html" id="btn-add" class="btn-add hidden">
          <span class="btn-add-icon">+</span>
          <span>添加商品</span>
        </a>
      </div>
    </div>
  </header>

  <div id="guest-banner" class="guest-banner">
    <div class="container">
      <span>👀 预览模式 — 登录后可管理商品数据</span>
    </div>
  </div>

  <main class="container">
    <section class="card list-panel">
      <div class="list-header">
        <h2>全部商品</h2>
        <div class="stats">
          <span class="chip" id="count-chip">共 0 件</span>
          <span class="chip chip-accent" id="total-chip">总计 ¥0.00</span>
        </div>
      </div>

      <div class="toolbar">
        <input type="text" id="search" placeholder="搜索商品名称 / 备注..." />
        <select id="filter-category">
          <option value="">全部分类</option>
          <option value="家具">家具</option>
          <option value="家电">家电</option>
          <option value="灯具">灯具</option>
          <option value="建材">建材</option>
          <option value="软装">软装</option>
          <option value="厨房">厨房</option>
          <option value="卫浴">卫浴</option>
          <option value="数码">数码</option>
          <option value="其他">其他</option>
        </select>
        <select id="filter-status">
          <option value="">全部状态</option>
          <option value="待发货">待发货</option>
          <option value="已发货">已发货</option>
          <option value="已收货">已收货</option>
          <option value="已完成">已完成</option>
        </select>
        <button id="export-btn" class="btn-ghost" type="button">导出数据</button>
        <label class="btn-ghost" for="import-file" style="cursor:pointer;">导入数据</label>
        <input type="file" id="import-file" accept="application/json" hidden />
      </div>

      <ul id="item-list" class="item-list"></ul>

      <div id="empty-state" class="empty-state">
        <div class="empty-icon">📦</div>
        <p>还没有商品，<a href="add.html" class="empty-link">去添加第一件</a></p>
      </div>
    </section>
  </main>

  <div id="auth-modal" class="modal hidden">
    <div class="auth-modal-backdrop"></div>
    <div class="auth-modal">
      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab active" type="button">登录</button>
        <button id="tab-register" class="auth-tab" type="button">注册</button>
      </div>
      <form id="login-form" class="auth-form">
        <div class="auth-field">
          <label for="login-username">用户名</label>
          <input type="text" id="login-username" placeholder="输入用户名" autocomplete="username" required />
        </div>
        <div class="auth-field">
          <label for="login-password">密码</label>
          <input type="password" id="login-password" placeholder="输入密码" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-primary auth-submit">登录</button>
      </form>
      <form id="register-form" class="auth-form hidden">
        <div class="auth-field">
          <label for="register-username">用户名</label>
          <input type="text" id="register-username" placeholder="2-50个字符" autocomplete="username" required />
        </div>
        <div class="auth-field">
          <label for="register-password">密码</label>
          <input type="password" id="register-password" placeholder="至少4位" autocomplete="new-password" required />
        </div>
        <button type="submit" class="btn-primary auth-submit">注册</button>
      </form>
    </div>
  </div>

  <div id="image-modal" class="modal hidden">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-body">
      <button class="modal-prev" id="modal-prev">&#8592;</button>
      <img id="modal-img" alt="大图预览" />
      <button class="modal-next" id="modal-next">&#8594;</button>
      <button class="modal-close" data-close>&#215;</button>
      <div class="modal-counter" id="modal-counter"></div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <small>数据保存在云端数据库，支持多设备同步</small>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
